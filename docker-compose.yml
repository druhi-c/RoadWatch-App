version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: roadwatch_db
    environment:
      POSTGRES_DB: roadwatch
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: roadwatch_backend
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/roadwatch
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - AI_SERVICE_URL=http://ai_service:8000
    ports:
      - "8080:8080"
    depends_on:
      - db
    restart: unless-stopped

  ai_service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: roadwatch_ai_service
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  postgres_data:
